name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check-version:
    name: Check version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify versions match tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"

          PKG_VER=$(jq -r .version package.json)
          CARGO_VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VER=$(jq -r .version src-tauri/tauri.conf.json)

          FAILED=0
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER)"
            FAILED=1
          fi
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) does not match tag ($TAG_VER)"
            FAILED=1
          fi
          if [ "$TAURI_VER" != "$TAG_VER" ]; then
            echo "::error::tauri.conf.json version ($TAURI_VER) does not match tag ($TAG_VER)"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All versions match tag: $TAG_VER"

  build-and-release:
    name: Build and release
    # Build against the latest macOS SDK so window chrome (traffic-light
    # positions) renders natively on each OS. Building with an older SDK than
    # the running OS (e.g. SDK 15 on macOS 26 Tahoe) shifts the buttons down.
    runs-on: macos-26
    needs: check-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (ad-hoc signing)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm run tauri build -- --no-bundle
          npm run tauri bundle -- --bundles app,dmg

      - name: Archive App Bundle as zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/popmark-${VERSION}-macos.zip" Popmark.app

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          # Use a PAT instead of GITHUB_TOKEN so that the release event triggers
          # other workflows (e.g. homebrew-tap). Events fired by GITHUB_TOKEN do
          # not trigger subsequent workflow runs by design.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            popmark-*-macos.zip
            src-tauri/target/release/bundle/dmg/*.dmg
