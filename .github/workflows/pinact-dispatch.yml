name: pinact (Dispatch)

on:
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: suzuki-shunsuke/pinact-action@v2.0.0
        with:
          app_id: ${{ vars.ACTIONS_APP_ID }}
          app_private_key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          skip_push: "true"

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/pinact
          title: "chore: pin GitHub Actions to commit SHAs"
          body: "Automatically generated by pinact via workflow_dispatch."
          commit-message: "chore: pin GitHub Actions to commit SHAs"
