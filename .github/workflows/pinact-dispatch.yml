name: pinact (Dispatch)

on:
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          app_id: ${{ vars.ACTIONS_APP_ID }}
          app_private_key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          skip_push: "true"

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/pinact
          title: "chore: pin GitHub Actions to commit SHAs"
          body: "Automatically generated by pinact via workflow_dispatch."
          commit-message: "chore: pin GitHub Actions to commit SHAs"
