[package]
name = "popmark"
version = "1.5.0"
description = "A popup Markdown editor triggered by a global shortcut"
authors = []
edition = "2021"

[lib]
name = "popmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
font-enumeration = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSImage"] }
image = { version = "0.25", default-features = false, features = ["png"] }
window-vibrancy = "0.8"
